<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <! Aerospace dark background with subtle border >
  <rect width="64" height="64" rx="14" fill="#040913" />
  <rect x="1" y="1" width="62" height="62" rx="13" stroke="rgba(220, 38, 38, 0.4)" strokewidth="1.5" />
  
  <! Supersonic Mach waves / afterburner trails >
  <path d="M12 48 L26 38" stroke="#DC2626" strokewidth="2" strokelinecap="round" strokedasharray="2 3" opacity="0.8" />
  <path d="M14 52 L30 41" stroke="#DC2626" strokewidth="2.5" strokelinecap="round" />
  <path d="M10 54 L22 45" stroke="#F87171" strokewidth="1.5" strokelinecap="round" opacity="0.6" />

  <! Supersonic Fighter Jet Delta Silhouette (SAG Official Contour) >
  <path d="M52 14 L34 31 L24 33 L21 39 L27 38 L30 42 L25 43 L23 47 L28 46 L32 49 L36 41 L47 34 L54 13 Z" fill="#FFFFFF" />
  <path d="M52 14 L36 29 L28 32 L36 34 L47 34 L54 13 Z" fill="#E2E8F0" />
  
  <! Supersonic Red Shockwave Needle >
  <line x1="52" y1="14" x2="57" y2="10" stroke="#EF4444" strokewidth="2" strokelinecap="round" />
  <circle cx="57" cy="10" r="1.5" fill="#EF4444" />

  <! Bottom text accent SAG >
  <text x="32" y="58" textanchor="middle" fontfamily="'Inter', sansserif" fontweight="900" fontsize="8" fill="#FFFFFF" letterspacing="1">SAG</text>
</svg>